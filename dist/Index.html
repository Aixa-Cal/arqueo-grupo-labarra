<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Arqueo La Barra</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de una columna para celular (máx. 640px). Contar en pantalla completa, con barra de navegación inferior para Resultados y Productos. */
:root{
  --bg:#FBF5F2; --surface:#FFFFFF; --ink:#2A1614; --muted:#6E5A55; --line:#EBDCD6; --field:#F6EDE9;
  --brand:#D8160F; --brand-ink:#FFFFFF; --accent:#F0A62B;
  --ok:#23724A; --ok-bg:#DAF1E3; --warn:#7D5600; --warn-bg:#FFEDB8; --crit:#A8302A; --crit-bg:#F9D9D4;
  --font-display:'Archivo',system-ui,sans-serif; --font-body:'Public Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A0F0E; --surface:#261716; --ink:#F6E9E6; --muted:#C2A9A3; --line:#3E2B28; --field:#2F1F1D;
    --brand:#FF6B5E; --brand-ink:#2A0705; --accent:#F2B24C;
    --ok:#74D6A0; --ok-bg:#1B3A2A; --warn:#F2C655; --warn-bg:#3B3114; --crit:#FF9488; --crit-bg:#45221F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A0F0E; --surface:#261716; --ink:#F6E9E6; --muted:#C2A9A3; --line:#3E2B28; --field:#2F1F1D;
  --brand:#FF6B5E; --brand-ink:#2A0705; --accent:#F2B24C;
  --ok:#74D6A0; --ok-bg:#1B3A2A; --warn:#F2C655; --warn-bg:#3B3114; --crit:#FF9488; --crit-bg:#45221F; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 110px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.65rem;font-weight:800;line-height:1.15}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:800;font-size:1.05rem;letter-spacing:.02em}
.chip{font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--field);color:var(--muted);white-space:nowrap}
.chip.live{background:var(--ok-bg);color:var(--ok)}
.banner{background:var(--warn-bg);color:var(--warn);padding:10px 12px;border-radius:10px;font-size:.92rem}
.banner.bad{background:var(--crit-bg);color:var(--crit)}
.sub{color:var(--muted);font-size:.95rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.lbl{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.negs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.neg{min-height:64px;text-align:left;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:2px;font-weight:700}
.neg small{font-weight:500;color:var(--muted);font-size:.8rem}
.neg.on{border-color:var(--brand);background:var(--field)}
.neg.done small{color:var(--ok)}
.turnos{display:flex;flex-wrap:wrap;gap:8px}
.tchip{min-height:44px;padding:8px 14px;border-radius:99px;border:2px solid var(--line);background:var(--surface);font-weight:600;font-size:.92rem}
.tchip.on{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field input,.field select,.field textarea{min-height:48px;border:2px solid var(--line);background:var(--field);border-radius:10px;padding:10px 12px;width:100%}
.field textarea{min-height:110px;resize:vertical}
.btn{min-height:52px;border:0;border-radius:12px;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:1.05rem;padding:12px 18px;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.small{min-height:40px;font-size:.92rem;width:auto;padding:8px 14px}
.btn.danger{background:var(--crit);color:#fff}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;display:flex;flex-direction:column;gap:8px}
.bar-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{border:0;background:transparent;color:var(--brand);font-weight:700;padding:8px 0;min-height:40px}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--brand);width:0;transition:width .2s}
.help{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:.92rem}
.help summary{font-weight:600;cursor:pointer;min-height:28px}
.help ul{margin:8px 0 0;padding-left:18px;color:var(--muted)}
.pcard{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.pcard.s-ok{border-color:var(--ok)}
.pcard.s-rev{border-color:var(--accent)}
.pcard.s-crit{border-color:var(--crit)}
.cat{font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:10px}
.srch{min-height:44px;border:2px solid var(--line);background:var(--field);border-radius:10px;padding:8px 12px;width:100%}
.rline{display:grid;grid-template-columns:minmax(0,1fr) 96px 44px;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.rline small{display:block;color:var(--muted);font-size:.82rem}
.rline input{min-height:48px;width:100%;text-align:center;font-size:1.15rem;font-weight:700;border:2px solid var(--line);background:var(--field);border-radius:10px}
.rx{min-height:44px;border:0;background:transparent;color:var(--muted);font-size:1.2rem}
.rres{min-height:48px;text-align:left;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-weight:600;width:100%}
.rres small{color:var(--muted);font-weight:500;margin-left:6px}
.erow{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:8px}
.erow small{color:var(--muted)}
.tag.crit{background:var(--crit-bg);color:var(--crit)}
.calrow{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.dchips{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dchip{min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:.78rem;padding:0}
.dchip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.phead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.unit{font-size:.85rem;color:var(--muted);font-weight:600}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f span{font-size:.78rem;font-weight:600;color:var(--muted);text-align:center}
.f input{width:100%;min-height:52px;text-align:center;font-size:1.2rem;font-weight:700;border:2px solid var(--line);background:var(--field);border-radius:10px;padding:6px 4px;font-variant-numeric:tabular-nums}
.res{font-size:.95rem;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;min-height:28px}
.hint,.note{color:var(--muted);font-size:.85rem}
.pill{display:inline-block;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:99px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.rev{background:var(--warn-bg);color:var(--warn)}
.pill.crit{background:var(--crit-bg);color:var(--crit)}
.savebar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:6;
  padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px))}
.savebar .in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.savemsg{font-size:.85rem;color:var(--muted);text-align:center}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:6;
  padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
.nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.nav button{border:0;background:transparent;min-height:54px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.78rem;font-weight:600;color:var(--muted)}
.nav button.on{color:var(--brand);background:var(--field)}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.today{display:flex;flex-wrap:wrap;gap:8px}
.tb{font-size:.85rem;font-weight:600;padding:6px 12px;border-radius:99px;background:var(--field);color:var(--muted)}
.tb.ok{background:var(--ok-bg);color:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
.kpi{padding:2px 10px;border-left:1px solid var(--line);min-width:0}
.kpi:first-child{border-left:0;padding-left:0}
.kpi b{display:block;font-family:var(--font-display);font-size:1.45rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{font-size:.78rem;color:var(--muted)}
.cnt{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 14px}
.cnt summary{list-style:none;cursor:pointer;padding:10px 0;display:flex;flex-direction:column;gap:6px;min-height:48px}
.cnt summary::-webkit-details-marker{display:none}
.cnt .l1{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.cnt .l2{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.85rem;color:var(--muted)}
.tw{overflow-x:auto;margin:4px 0 10px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 8px 6px 0;white-space:nowrap}
td{padding:7px 8px 7px 0;border-top:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;padding-right:10px}
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.pitem div{min-width:0}
.pitem small{display:block;color:var(--muted);font-size:.82rem}
.tag{font-size:.7rem;font-weight:700;background:var(--warn-bg);color:var(--warn);padding:2px 8px;border-radius:99px;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.big{font-size:3rem;line-height:1}
.center{text-align:center;align-items:center}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 140px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:20;font-size:.92rem;max-width:90vw}
@media (max-width:360px){.negs{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.bell{position:relative;min-width:44px;min-height:44px;border:0;background:var(--field);border-radius:99px;display:grid;place-items:center;color:var(--ink)}
.bell svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:2px;right:2px;min-width:18px;height:18px;border-radius:99px;background:var(--crit);color:#fff;font-size:.7rem;font-weight:700;display:grid;place-items:center;padding:0 5px}
.nav .badge{top:4px;right:calc(50% - 22px)}
.nav button{position:relative}
.tr{display:flex;align-items:center;gap:8px}
.who{font-size:.78rem;color:var(--muted);text-align:right;line-height:1.2}
.linkbtn{border:0;background:transparent;color:var(--brand);font-weight:700;padding:6px 4px;min-height:36px;text-decoration:underline}
.nav .in.n5{grid-template-columns:repeat(5,1fr)}
.nav .in.n3{grid-template-columns:repeat(3,1fr)}
.nav .in.n4{grid-template-columns:repeat(4,1fr)}
.stat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sbox b{display:block;font-family:var(--font-display);font-size:1.5rem;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.sbox span{font-size:.8rem;color:var(--muted)}
.sbox.bad b{color:var(--crit)} .sbox.good b{color:var(--ok)}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px}
.bars i{flex:1;background:var(--brand);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars i.z{background:var(--line)}
.barlbl{display:flex;gap:4px;font-size:.68rem;color:var(--muted)}
.barlbl span{flex:1;text-align:center;overflow:hidden}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok)}
.prog i.w{background:var(--accent)} .prog i.b{background:var(--crit)}
.row-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:40px;padding:6px 14px;border-radius:99px;border:2px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem}
.seg button.on{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
.ni{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%}
.ni.unread{border-color:var(--brand);background:var(--field)}
.ni b{display:block} .ni small{display:block;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:99px;background:var(--brand);margin-top:6px;flex:none}
.ni:not(.unread) .dot{background:transparent}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px}
.sw button{min-width:64px}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.vrow input{min-height:46px;width:100%;text-align:center;font-size:1.1rem;font-weight:700;border:2px solid var(--line);background:var(--field);border-radius:10px}
.vrow small{display:block;color:var(--muted);font-size:.78rem}
.vrow.auto0 input{color:var(--muted)}
.ualloc{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:8px 0;border-top:1px solid var(--line)}
.ualloc select{min-height:44px;border:2px solid var(--line);background:var(--field);border-radius:10px;padding:6px 8px;width:100%}
.fileb{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 16px;border-radius:12px;border:2px dashed var(--brand);color:var(--brand);font-weight:700;cursor:pointer;text-align:center}
.fileb input{display:none}
.rt input{width:72px;min-height:40px;text-align:center;border:2px solid var(--line);background:var(--field);border-radius:8px;font-weight:700}
.login{max-width:420px;margin:8vh auto 0}
.login input.code{font-size:1.8rem;letter-spacing:.4em;text-align:center;font-weight:800}
.loading{display:grid;place-items:center;padding:40px 0;color:var(--muted)}
.mini{font-size:.8rem;color:var(--muted)}
.hi{color:var(--crit);font-weight:700}
.upill{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--field);color:var(--muted)}
.upill.admin{background:var(--warn-bg);color:var(--warn)} .upill.gerencia{background:var(--ok-bg);color:var(--ok)}
.hoyrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:.92rem}
.hoyrow:first-child{border-top:0}
.st{font-size:.76rem;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.st.ok{background:var(--ok-bg);color:var(--ok)} .st.wait{background:var(--field);color:var(--muted)} .st.late{background:var(--crit-bg);color:var(--crit)} .st.pend{background:var(--warn-bg);color:var(--warn)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fchips{display:flex;gap:6px;overflow-x:auto;padding:6px 0 2px;-webkit-overflow-scrolling:touch}
.tchip.sm{min-height:36px;padding:4px 12px;font-size:.84rem;white-space:nowrap;flex:0 0 auto}
.tchip.sm small{opacity:.75;font-weight:500;margin-left:2px}
.fbox{display:flex;flex-direction:column;gap:6px;margin:4px 0 10px}
.fchips{margin:0 -2px;padding-left:2px;padding-right:2px}
.bar .back{white-space:nowrap;flex:0 0 auto}
.bar .bar-row .sub{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .chip{flex:0 0 auto}
/* espaciado entre bloques de cada pantalla */
main#view{display:flex;flex-direction:column;gap:14px}
main#view>*{min-width:0}
.fbox{margin:0}
.tw{margin:0}
.panel>.tw{margin:4px 0 0}
.stat{gap:12px}
.pitem{padding:14px 16px}
.hoyrow{padding:10px 0}
.savemsg{min-height:1.2em}
[hidden]{display:none!important}
input.ro{background:var(--line);color:var(--muted);border-style:dashed}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chk{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:8px 12px;margin:6px 0;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:.95rem;text-align:left}
.chk .bx{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800}
.chk.on{border-color:var(--brand)}.chk.on .bx{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.upill.supervisor{background:#e8e4ff;color:#4b3bb5}
.wabox{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.btn.wa{background:#1f9d55;color:#fff;border-color:#1f9d55;text-decoration:none;display:inline-flex;align-items:center}
.brand img{width:34px;height:36px;border-radius:50%;flex:none}

/* Temas por negocio: Car Wash (azul) y Zona Presidente (neón verde sobre negro) */
:root[data-neg="cw"]{--brand:#1A5FC8;--brand-ink:#FFFFFF;--bg:#F2F6FC;--line:#D6E0F0;--field:#EAF0F9;--ink:#0F1E3A;--muted:#52627F;--accent:#F5B82E}
:root[data-neg="zp"]{--bg:#F4F9F5;--surface:#FFFFFF;--ink:#0E1F14;--muted:#4F6757;--line:#D3E4D8;--field:#EAF3ED;--brand:#14803A;--brand-ink:#FFFFFF;--accent:#F0A62B;--ok:#23724A;--ok-bg:#DAF1E3;--warn:#7D5600;--warn-bg:#FFEDB8;--crit:#A8302A;--crit-bg:#F9D9D4;color-scheme:light}
@media (prefers-color-scheme: dark){:root[data-neg="cw"]:not([data-theme="light"]){--bg:#08101F;--surface:#101C33;--ink:#E8EFFC;--muted:#A5B6D4;--line:#1F3254;--field:#17263F;--brand:#5B9BFF;--brand-ink:#06172E}}
.brand img.zpl{width:auto;height:38px;max-width:200px;border-radius:8px;object-fit:contain;background:#000}

/* Pendientes y avisos: agrupados por día, sin ruido */
.psec{display:flex;flex-direction:column;gap:8px}
.psec h2,.psec summary{font-size:1.05rem;font-weight:800;display:flex;align-items:center;gap:8px;margin:6px 0 0}
.psec h2 span,.psec summary span,.dayh span{background:var(--field);color:var(--muted);border-radius:99px;padding:1px 9px;font-size:.78rem;font-weight:700}
.psec summary{cursor:pointer;list-style:none;padding:12px 2px;min-height:44px}
.psec summary::-webkit-details-marker{display:none}
.psec summary::after{content:"▾";margin-left:auto;color:var(--muted)}
.psec[open] summary::after{content:"▴"}
.psec .hint{margin:0 0 2px}
.dayh{display:flex;align-items:center;gap:8px;margin:10px 2px 0;font-size:.85rem;color:var(--muted)}
.dayh b{font-weight:700;text-transform:capitalize}
.pitem b{font-size:1rem}
.ni .nbody{flex:1;min-width:0}
.ni .nbody small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ni .when{font-size:.78rem;color:var(--muted);white-space:nowrap}
.dayd{display:flex;flex-direction:column;gap:8px}
.dayd>summary{cursor:pointer;list-style:none;min-height:44px;margin:6px 0 0}
.dayd>summary::-webkit-details-marker{display:none}
.dayd>summary::after{content:"▾";margin-left:auto;color:var(--muted)}
.dayd[open]>summary::after{content:"▴"}
.datebar{display:flex;flex-direction:column;gap:6px}
.dbrow{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.dpick{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px;border:2px solid var(--line);background:var(--field);border-radius:10px;padding:10px 12px;width:100%;cursor:pointer}
.dpick:focus-within{border-color:var(--brand)}
.dptxt{font-weight:600}
.dpic{color:var(--brand);flex:none}
.dpin{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.dpin::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}

.nav .in.n6{grid-template-columns:repeat(6,1fr);gap:2px}.nav .in.n6 button{font-size:10px;padding-left:0;padding-right:0}
.althw{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.alth{position:relative}.alth img{width:92px;height:92px;object-fit:cover;border-radius:10px}.alth .rx{position:absolute;top:-6px;right:-6px}.alfoto{display:block;width:100%;max-width:420px;border-radius:10px;margin:6px 0}
.chips2{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chips2 .tchip.on{background:#B3261E;color:#fff;border-color:#B3261E}

/* Mi semana */
.sem-hero{display:flex;gap:14px;align-items:center;border-radius:16px;padding:16px;border:1px solid var(--line)}
.sem-hero .big{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-size:1.6rem;font-weight:800}
.sem-hero h2{font-size:1.15rem;margin:0 0 2px}.sem-hero p{margin:0;color:var(--muted);font-size:.92rem}
.sem-hero.ok{background:var(--ok-bg)}.sem-hero.ok .big{background:var(--ok);color:#fff}
.sem-hero.bad{background:var(--crit-bg)}.sem-hero.bad .big{background:var(--crit);color:#fff}
.sem-bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:12px}.sem-bar span{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.sem-barp{margin:6px 0 0;color:var(--muted);font-size:.85rem}
.sem-lista h2,.sem-card h2{font-size:1.05rem;margin:0}
.sem-lista{display:grid;gap:10px}
.sem-acc{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--warn);border-radius:12px;padding:12px 14px}
.sem-acc.bad{border-left-color:var(--crit)}
.sem-at{min-width:0}.sem-at b{display:block}.sem-at small{display:block;color:var(--muted);font-size:.84rem}
.sem-acc .btn.small{width:auto;min-height:44px;flex:none;padding:8px 14px;font-size:.95rem}
.sem-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:12px}
.sem-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.sem-h small{color:var(--muted);font-size:.84rem}
.sem-dias{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.sem-d{border:1px solid var(--line);border-radius:12px;background:var(--bg);min-height:64px;padding:6px 2px;display:grid;gap:4px;place-items:center;align-content:center}
.sem-d i{font-style:normal;font-size:.78rem;color:var(--muted);font-weight:700}
.sem-d b{font-size:1.05rem;font-weight:800;white-space:nowrap}
.sem-d.hoy{outline:2px solid var(--accent);outline-offset:1px}
.sem-d.k-ok,.sem-d.k-ini{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.sem-d.k-ventas{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.sem-d.k-falta{background:var(--crit-bg);color:var(--crit);border-color:transparent}
.sem-d.k-hoy,.sem-d.k-na{color:var(--muted)}
.sem-ley{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem;color:var(--muted)}
.sem-ley b{display:inline-block;min-width:18px;text-align:center;font-weight:800}
.sem-ley .k-ok b{color:var(--ok)}.sem-ley .k-ventas b{color:var(--warn)}.sem-ley .k-falta b{color:var(--crit)}
.sem-g{display:flex;justify-content:space-between;gap:10px;align-items:center;min-height:44px;border-top:1px solid var(--line);padding-top:8px}
.sem-g .btn.small{width:auto;min-height:40px;padding:6px 14px}
.pill.mute{background:var(--line);color:var(--muted)}
.sem-link{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:48px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:700;text-align:left}.sem-link span{color:var(--brand)}
.sem-ayuda{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 14px}
.sem-ayuda summary{min-height:52px;display:flex;align-items:center;font-weight:800;cursor:pointer}
.sem-pasos{margin:0 0 10px;padding-left:22px;display:grid;gap:10px}
.sem-nota{background:var(--bg);border-radius:12px;padding:12px;margin:0 0 12px;font-size:.9rem;line-height:1.5;color:var(--muted)}
.lg-ayuda{background:var(--field);border-radius:12px;padding:12px 14px;font-size:.92rem;line-height:1.45}.lg-ayuda p{margin:4px 0 0;color:var(--muted)}
.eq-b{display:flex;gap:8px;flex:none}.eq-b .btn.small{min-height:44px}
.eq-enlace{border:2px solid var(--ok)}.btn.wa{display:flex;align-items:center;justify-content:center;text-decoration:none;background:#1FA855;color:#fff}

.guia{position:fixed;inset:0;z-index:50;background:rgba(20,10,10,.55);display:grid;place-items:center;padding:16px}
.guia-box{position:relative;background:var(--surface);border-radius:24px;padding:28px 22px 22px;width:100%;max-width:420px;text-align:center;display:grid;gap:12px}
.guia-e{font-size:4.5rem;line-height:1}
.guia-box h2{font-size:1.5rem;margin:0}.guia-box p{font-size:1.15rem;line-height:1.5;margin:0}
.guia-x{position:absolute;top:8px;right:8px;width:44px;height:44px;border:0;background:transparent;font-size:1.3rem;color:var(--muted)}
.guia-dots{display:flex;justify-content:center;gap:8px;margin:4px 0}.guia-dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.guia-dots i.on{background:var(--brand);width:26px;border-radius:6px}
.guia-b{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px}
.guia-btn{border:2px solid var(--brand);background:transparent;color:var(--brand);border-radius:12px;min-height:48px;font-weight:700;font-size:1rem;padding:10px 14px;width:100%;margin-top:10px}
.ley{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:6px;font-size:1rem}
.ley p{margin:0;line-height:1.4}.ley-t{display:flex;justify-content:space-between;align-items:center}
.ley-t .linkbtn{font-weight:700;color:var(--brand)}
.f span{font-size:.95rem}.f input{min-height:58px;font-size:1.4rem}
.pcard h3{font-size:1.1rem}
</style>
</head>

function usage(v){
  var ini=num(v.ini),ent=num(v.ent)||0,fin=num(v.fin);
  if(!conDoble()&&!v.src){if(fin==null)return null;return {real:0,first:true}}

function usageHTML(u){

  if(u.real<0)return '<span class="pill crit">Revisa</span><span class="hint">Hay más de lo que debía haber. Vuelve a contar.</span>';
  return '<span class="pill ok">✓ Listo</span><span class="hint">Se usaron '+fmt(u.real)+'</span>';

async function guardar(){
  if(S.saving)return;
  var d=S.draft,items=[],sin=[];
  negProducts().forEach(function(p){
    var v=d.vals[p.id],u=usage(v);
    if(u)items.push({pid:p.id,ini:(u.first?num(v.fin):num(v.ini)),ent:num(v.ent)||0,fin:num(v.fin),src:v.src||""});
    else sin.push(p.nombre);
  });
  if(!items.length)return;
  S.saving=true;updateProgress();
  try{
    await api("saveConteo",{id:d.id,fecha:d.fecha,negocio:d.negocio,turno:d.turno,items:items,sin:sin,nota:(d.nota||"").trim(),cierre:conCierre(d.negocio)?{chk:CIERRE.map(function(t,i){return !!cierreDe(d).chk[i]}),nov:cierreDe(d).nov,txt:cierreDe(d).nov==='si'?cierreDe(d).txt.trim():'',cafe:conCafe(d.negocio)?cierreDe(d).cafe:undefined,fz:conFreezer(d.negocio)?cierreDe(d).fz:undefined}:null});
    S.saved={negocio:d.negocio,turno:d.turno,fecha:d.fecha,n:items.length,sin:sin.length,ini:items.every(function(i){return !i.src})};
    S.step="listo";clearDraft();S.saving=false;render();window.scrollTo(0,0);refresh(true);
  }catch(e){
    S.saving=false;
    if(e.code==="duplicado"){toast(errMsg(e));S.step="elegir";clearDraft();render()}
    else{updateProgress();toast(errMsg(e))}
  }
}

function haceTxt(ts){
  var m=Math.max(0,Math.round((Date.now()-ts)/60000));
  if(m<60)return "hace "+m+" min";
  var h=Math.round(m/60);if(h<48)return "hace "+h+" h";
  return "hace "+Math.round(h/24)+" días";
}
function porCompletar(){
  var h=today(),hm=nowHM(),rows=[],seen={};
  var first=h;S.conteos.forEach(function(c){if(c.estado!=="anulado"&&c.fecha<first)first=c.fecha});
  var from=addDays(h,-2);if(from<first)from=first;
  var f=h,days=[];while(f>=from){days.push(f);f=addDays(f,-1)}
  var sel=S.pFecha&&S.pFecha<=h?S.pFecha:"";if(sel)days=[sel];
  days.forEach(function(fe){
    S.cfg.negocios.forEach(function(n){
      if(!isFullDay(n,fe))return;
      turnosFor(n).forEach(function(t){
        var c=S.conteos.filter(function(x){return x.negocio===n&&x.turno===t&&x.fecha===fe&&x.estado!=="anulado"})[0];
        var lim=limiteDe(n,t);
        if(c){seen[c.id]=1;
          if(fe!==h&&!sel&&c.estado!=="contado")return;
          rows.push({k:c.estado==="contado"?"ventas":(c.estado==="arqueado"?"ok":"ini"),n:n,t:t,fe:fe,c:c,lim:lim});
        }else if(fe===h){
          var late=lim&&hm>lim;
          rows.push({k:late?"atraso":"falta",n:n,t:t,fe:fe,lim:lim});
        }else rows.push({k:"atraso",n:n,t:t,fe:fe,lim:lim,past:true});
      });
    });
  });
  if(!sel)S.conteos.forEach(function(c){if(c.estado==="contado"&&!seen[c.id])rows.push({k:"ventas",n:c.negocio,t:c.turno,fe:c.fecha,c:c,lim:""})});
  var ord={atraso:0,ventas:1,falta:2,ok:3,ini:4};
  rows.sort(function(a,b){return (ord[a.k]-ord[b.k])||(a.fe<b.fe?1:a.fe>b.fe?-1:0)});
  return rows;
}

/* ---------- registrar ventas ---------- */
function similar(a,b){
  function cl(s){return normClave(s).replace(/\b(fs|zp|inventario|botella|plastica|fardo|caja|x\d+|de|con)\b/g," ").replace(/\s+/g," ").trim()}
  a=cl(a);b=cl(b);if(!a||!b)return 0;if(a===b)return 1;
  function bg(s){var m={},n=0;for(var i=0;i<s.length-1;i++){var k=s.substr(i,2);m[k]=(m[k]||0)+1;n++}return {m:m,n:n}}
  var x=bg(a),y=bg(b),hit=0;
  Object.keys(x.m).forEach(function(k){if(y.m[k])hit+=Math.min(x.m[k],y.m[k])});
  return x.n+y.n?2*hit/(x.n+y.n):0;
}
function parseCSV(text){
  var rows=[],row=[],cur="",q=false;
  text=String(text).replace(/^﻿/,"");
  for(var i=0;i<text.length;i++){
    var c=text.charAt(i);
    if(q){if(c==='"'){if(text.charAt(i+1)==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;
    else if(c===","||c===";"){row.push(cur);cur=""}
    else if(c==="\n"){row.push(cur);rows.push(row);row=[];cur=""}
    else if(c!=="\r")cur+=c;
  }
  if(cur!==""||row.length){row.push(cur);rows.push(row)}
  return rows;
}
function parseQty(s){s=String(s).trim().replace(/,/g,"");return /^-?\d+(\.\d+)?$/.test(s)?parseFloat(s):null}
function parseCitrus(text){
  var out=[];
  parseCSV(text).forEach(function(r){
    if(r.length<2)return;
    var q=parseQty(r[r.length-1]),name=String(r[0]).trim();
    if(q==null||!name||q<0)return;
    out.push({name:name,q:q});
  });
  return out;
}
function nameIndex(){
  var m={};
  S.productos.forEach(function(p){m[normClave(p.nombre)]=p.id});
  return m;
}
function groupTramos(c){
  var g={},order=[];
  c.items.forEach(function(it){
    var k=it.src||"_ini";
    if(!g[k]){g[k]={key:k,items:[],set:{},info:c.srcInfo&&c.srcInfo[k]};order.push(k)}
    g[k].items.push(it.pid);g[k].set[it.pid]=1;
  });
  order.sort(function(a,b){var x=g[a].info?g[a].info.ts:0,y=g[b].info?g[b].info.ts:0;return x-y});
  return order.map(function(k){return g[k]});
}

function applyCsv(key,text,fname,add){
  var vs=S.vs,rows=parseCitrus(text);
  if(!rows.length){toast("No encontré ventas en ese archivo. Debe ser el reporte «Ventas por producto» de Citrus en CSV.");return false}
  var old=add&&vs.csv[key];

function recomputeTramo(key){
  var vs=S.vs,csv=vs.csv[key],t=vs.tramos.filter(function(x){return x.key===key})[0];
  if(!csv||!t)return;
  var sums={},uns={},fuera=0,ign=0,asg=0,idx=nameIndex(),names=t.items.map(function(pid){var p=prodById(pid);return {pid:pid,n:p?p.nombre:pid}});
  csv.rows.forEach(function(r){
    var k=normClave(r.name),pid=vs.assign[k]!=null?vs.assign[k]:(S.aliases[k]!=null?S.aliases[k]:idx[k]);
    if(pid==="-"){ign++;return}
    if(pid){if(t.set[pid]){sums[pid]=(sums[pid]||0)+r.q;asg++}else fuera++;return}
    var u=uns[k]||(uns[k]={key:k,name:r.name,q:0});u.q+=r.q;
  });
  var list=Object.keys(uns).map(function(k){
    var u=uns[k],sc=names.map(function(x){return {pid:x.pid,n:x.n,s:similar(u.name,x.n)}}).sort(function(a,b){return b.s-a.s}).slice(0,5);
    u.sug=sc.filter(function(x){return x.s>=0.35});u.best=sc.length?sc[0].s:0;return u;
  });
  csv.por=list.filter(function(u){return u.best>=0.55}).sort(function(a,b){return b.q-a.q}).slice(0,40);
  csv.otros=list.filter(function(u){return u.best<0.55});
  csv.stats={asg:asg,fuera:fuera,ign:ign,total:csv.rows.length};
  t.items.forEach(function(pid){
    if(vs.touched[pid])return;
    if(sums[pid]!=null){vs.vals[pid]=fmtRaw(sums[pid]);vs.auto0[pid]=false}
    else{vs.vals[pid]="0";vs.auto0[pid]=true}
  });
}

async function calcVentas(){
  var vs=S.vs,k=vsCounts();
  if(vs.saving)return;
  if(k.blank&&!vs.confirm){vs.confirm=true;updateVsFoot();return}
  var ventas={};
  vsItems().forEach(function(i){var q=num(vs.vals[i.pid]);ventas[i.pid]=q==null?0:q});
  vs.saving=true;updateVsFoot();
  try{
    var map={};
    Object.keys(vs.assign).forEach(function(key){
      var pid=vs.assign[key];if(!pid)return;
      var orig=key;
      Object.keys(vs.csv).forEach(function(tk){(vs.csv[tk].rows||[]).forEach(function(r){if(normClave(r.name)===key)orig=r.name})});
      map[key]={pid:pid,original:orig};
      S.aliases[key]=pid;
    });
    if(Object.keys(map).length)await api("saveAliases",{map:map});
    var r=await api("saveVentas",{id:vs.id,ventas:ventas});
    var id=vs.id;S.vs=null;toast("Arqueo calculado");

var CRCT=null;
function crc32(u8){if(!CRCT){CRCT=[];for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;CRCT[n]=c>>>0}}var c=0xFFFFFFFF;for(var i=0;i<u8.length;i++)c=CRCT[(c^u8[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zipStore(files){
  var enc=new TextEncoder(),parts=[],cen=[],off=0;
  function u16(n){return [n&255,(n>>8)&255]}function u32(n){return [n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255]}
  files.forEach(function(f){
    var nm=enc.encode(f[0]),d=enc.encode(f[1]),cr=crc32(d);
    var lh=[].concat(u32(0x04034b50),u16(20),u16(0x0800),u16(0),u16(0),u16(0x21),u32(cr),u32(d.length),u32(d.length),u16(nm.length),u16(0));
    parts.push(new Uint8Array(lh),nm,d);
    cen.push([].concat(u32(0x02014b50),u16(20),u16(20),u16(0x0800),u16(0),u16(0),u16(0x21),u32(cr),u32(d.length),u32(d.length),u16(nm.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(off)),Array.prototype.slice.call(nm));
    off+=lh.length+nm.length+d.length;
  });
  var cs=0,cd=[];cen.forEach(function(a){cs+=a.length;cd.push(new Uint8Array(a))});
  var end=new Uint8Array([].concat(u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(cs),u32(off),u16(0)));
  return new Blob(parts.concat(cd,[end]),{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
function xmlE(v){return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function xlsxDown(name,sheet,rows){
  var cols="ABCDEFGHIJ";
  var sd=rows.map(function(r,ri){return '<row r="'+(ri+1)+'">'+r.map(function(v,ci){
    var ref=cols[ci]+(ri+1);if(v===""||v==null)return "";
    return typeof v==="number"?'<c r="'+ref+'"><v>'+v+'</v></c>':'<c r="'+ref+'" t="inlineStr"><is><t>'+xmlE(v)+'</t></is></c>'}).join("")+'</row>'}).join("");
  var X='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
  var b=zipStore([
    ["[Content_Types].xml",X+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>'],

    ["xl/workbook.xml",X+'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="'+xmlE(sheet)+'" sheetId="1" r:id="rId1"/></sheets></workbook>'],
    ["xl/_rels/workbook.xml.rels",X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>'],
    ["xl/worksheets/sheet1.xml",X+'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'+sd+'</sheetData></worksheet>']
  ]);
  var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();

async function rectSave(){

async function openNotif(id){
  var n=S.notifs.filter(function(x){return x.id===id})[0];if(!n)return;
  if(!n.leido){n.leido=true;api("markRead",{ids:[id]}).catch(function(){})}
  var ref=String(n.ref||"").split("|");
  if(isAdmin()&&n.tipo==="acceso"){S.view="eq";S.eq.users=null;render();return}
  if(ref[0]==="conteo"){
    if(canVentas()&&n.tipo==="pendiente"){openVentas(ref[1]);return}
    if(role()!=="colaborador"){openDetalle(ref[1]);return}
  }
  if(n.tipo==="falta"||n.tipo==="ventas-tarde"){S.view=canVentas()?"pend":(role()==="gerencia"?"panel":"mios");render();return}
  render();
}

function fotoComprimir(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){rej(new Error("No pude leer la foto."))};
    fr.onload=function(){
      var im=new Image();
      im.onerror=function(){rej(new Error("No pude abrir la foto."))};
      im.onload=function(){
        var m=1400,w=im.width,h=im.height,k=Math.min(1,m/Math.max(w,h));
        var c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);
        c.getContext("2d").drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL("image/jpeg",0.72));
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---------- Mi semana (panel del supervisor: arqueos semanales obligatorios) ---------- */
var SEM_OBLIG=["Food Shop","Zona Presidente"];
var SEM_GEN=["Food Shop General","La Barra Atala General","La Barra Atalaya General","La Barra Miraflores General"];
var DIA_INI=["D","L","M","M","J","V","S"];
function semLunes(h){return addDays(h,-((dow(h)+6)%7))}
function semFechas(lun){var a=[];for(var i=0;i<7;i++)a.push(addDays(lun,i));return a}
function semRango(lun){
  var d=addDays(lun,6),a=+lun.slice(8),b=+d.slice(8),ma=+lun.slice(5,7),mb=+d.slice(5,7);
  return ma===mb?a+" al "+b+" de "+MESES[mb-1]:a+" de "+MESES[ma-1]+" al "+b+" de "+MESES[mb-1];
}
/* estado de un turno en una fecha: ok | ini | ventas | falta | hoy | na */
function semEstado(neg,t,fe,h){
  var c=S.conteos.filter(function(x){return x.negocio===neg&&x.turno===t&&x.fecha===fe&&x.estado!=="anulado"})[0];
  if(c)return {k:c.estado==="arqueado"?"ok":(c.estado==="contado"?"ventas":"ini"),c:c};
  if(fe>h)return {k:"na"};
  if(fe<h)return {k:"falta",past:true};
  var lim=limiteDe(neg,t);
  return {k:(lim&&nowHM()>lim)?"falta":"hoy"};
}
var SEM_PRI={falta:4,ventas:3,hoy:2,ini:1,ok:0,na:-1};
/* devuelve {dias:[{fe,marks:[k..],peor}],rows:[{k,n,t,fe,c,lim,past}]} para un negocio y una semana */
function semInicio(neg,h){var f=h;S.conteos.forEach(function(c){if(c.negocio===neg&&c.estado!=="anulado"&&c.fecha<f)f=c.fecha});return f}
function semNegocio(neg,lun,h){
  var ini=semInicio(neg,h);
  var rows=[],dias=semFechas(lun).map(function(fe){
    var marks=[];
    if(fe>h||fe<ini||!isFullDay(neg,fe))return {fe:fe,marks:["na"],peor:"na"};
    turnosFor(neg).forEach(function(t){
      var e=semEstado(neg,t,fe,h);marks.push(e.k);
      if(e.k==="falta"||e.k==="ventas")rows.push({k:e.k==="falta"?"atraso":"ventas",n:neg,t:t,fe:fe,c:e.c,lim:limiteDe(neg,t),past:!!e.past});
    });
    if(!marks.length)marks=["na"];
    var peor=marks.reduce(function(a,b){return SEM_PRI[b]>SEM_PRI[a]?b:a},"na");
    return {fe:fe,marks:marks,peor:peor};
  });
  return {dias:dias,rows:rows};
}
function semTodo(){
  var h=today(),lun=semLunes(h),prev=addDays(lun,-7),neg={},acc=[],tot=0,ok=0,ant=[];
  SEM_OBLIG.filter(function(n){return S.cfg.negocios.indexOf(n)>-1}).forEach(function(n){
    var d=semNegocio(n,lun,h);neg[n]=d;
    d.dias.forEach(function(x){x.marks.forEach(function(k){if(k==="ok"||k==="ini"){tot++;ok++}else if(k==="falta"||k==="ventas")tot++})});
    acc=acc.concat(d.rows);
    var p=semNegocio(n,prev,h);ant=ant.concat(p.rows);
  });
  var ord=function(a,b){return (a.k===b.k?0:(a.k==="atraso"?-1:1))||(a.fe<b.fe?-1:a.fe>b.fe?1:0)};
  acc.sort(ord);ant.sort(ord);
  return {h:h,lun:lun,neg:neg,acc:acc,ant:ant,tot:tot,ok:ok};
}
/* conteos semanales generales: estado de esta semana */
function semGenerales(h,lun){
  var dom=addDays(lun,6);
  return SEM_GEN.filter(function(n){return S.cfg.negocios.indexOf(n)>-1}).map(function(n){
    var cal=(S.cfg.calendario&&S.cfg.calendario[n])||[],d=cal[0],c=S.conteos.filter(function(x){return x.negocio===n&&x.fecha>=lun&&x.fecha<=dom&&x.estado!=="anulado"})[0];
    var fe=(d==null)?"":addDays(lun,(d+6)%7),k,txt;
    if(c){k="ok";txt="Hecho"}
    else if(fe&&fe<h){k="falta";txt="Atrasado"}
    else if(fe===h){k="hoy";txt="Toca hoy"}
    else{k="na";txt="Toca el "+(d==null?"":DIAS_L[d].toLowerCase())}
    return {n:n,k:k,txt:txt,hoy:fe===h&&!c};
  });
}

function semNota(k){return {ok:"Listo",ini:"Listo",ventas:"Falta cargar ventas",falta:"Falta el conteo",hoy:"Hoy todavía puede contarse",na:"No aplica"}[k]||""}

    /* panel */
    "p-rango":function(){S.panel.rango=v;S.panel.data=null;loadPanel();render()},
    "p-reload":function(){S.panel.err="";S.panel.data=null;render();loadPanel()},
    /* catálogo */
    "new-prod":function(){S.cat.editing=blankProd();render();window.scrollTo(0,0)},
    "edit-prod":function(){var p=prodById(id);if(p){S.cat.editing={nuevo:false,id:p.id,nombre:p.nombre,cat:p.cat||"",critico:!!p.critico,unidad:p.unidad,factor:String(p.factor),tol:String(r2(p.tol*100,2)),costo:String(p.costo||0),negocios:(p.negocios||[]).slice(),orden:p.orden||Date.now()};render();window.scrollTo(0,0)}},
    "cancel-prod":function(){S.cat.editing=null;S.cat.pendingDel=null;render()},
    "tog-crit":function(){S.cat.editing.critico=!S.cat.editing.critico;el.classList.toggle("on")},
    "tog-neg":function(){var nn=S.cfg.todosNegocios[+v],a=S.cat.editing.negocios,i=a.indexOf(nn);if(i>-1)a.splice(i,1);else a.push(nn);el.classList.toggle("on")},
    "save-prod":function(){
      var e=S.cat.editing,fa=num(e.factor),to=num(e.tol),co=num(e.costo);
      if(!e.nombre.trim())return toast("Escribe el nombre del producto.");
      if(fa==null||fa<=0)return toast("«Se gasta por cada venta» debe ser mayor que 0.");
      if(to==null||to<0||to>100)return toast("La tolerancia va de 0 a 100.");
      if(co==null||co<0)co=0;
      guarded(async function(){
        await api("saveProducto",{id:e.id,nombre:e.nombre.trim(),cat:(e.cat||"").trim(),critico:!!e.critico,unidad:(e.unidad||"unid").trim(),factor:fa,tol:to/100,costo:co,negocios:e.negocios.slice(),orden:e.orden});
        S.cat.editing=null;toast("Producto guardado");await refresh(true);render();
      });
    },
    "del-prod":function(){S.cat.pendingDel=S.cat.editing.id;render()},
    "del-prod-no":function(){S.cat.pendingDel=null;render()},
    "del-prod-ok":function(){guarded(async function(){await api("delProducto",{id:S.cat.editing.id});S.cat.editing=null;S.cat.pendingDel=null;toast("Producto quitado");await refresh(true);render()})},
    "tog-dia":function(){
      var n=S.cfg.todosNegocios[+v],d=+el.dataset.d,cal=Object.assign({},S.cfg.calendario),arr=(Array.isArray(cal[n])?cal[n]:[0,1,2,3,4,5,6]).slice(),ix=arr.indexOf(d);
      if(ix>-1)arr.splice(ix,1);else arr.push(d);
      arr.sort();if(arr.length>=7)delete cal[n];else cal[n]=arr;
      S.cfg.calendario=cal;el.classList.toggle("on");
      saveCfg({calendario:cal},"Calendario guardado");
    },
    "tog-aviso":function(){var a=Object.assign({},S.cfg.avisos);a[v]=a[v]===false;S.cfg.avisos=a;render();saveCfg({avisos:a},"Guardado")},
    "save-turnos":function(){
      var negs=($("#neg-edit").value||"").split("\n").map(function(s){return s.trim()}).filter(Boolean);
      if(!negs.length)return toast("Deja al menos un negocio.");
      var turnos={},lim={},bad="";
      S.cfg.todosNegocios.forEach(function(n,i){
        var ta=$("#tt-"+i);if(!ta)return;
        var list=[];
        ta.value.split("\n").forEach(function(l){
          l=l.trim();if(!l)return;
          var p=l.split("|"),nm=p[0].trim(),hm=(p[1]||"").trim();
          if(hm&&!/^([01]?\d|2[0-3]):[0-5]\d$/.test(hm)){bad=n+": «"+hm+"» no es una hora válida (usa 23:30)";return}
          if(hm&&hm.length===4)hm="0"+hm;
          list.push(nm);if(hm)lim[n+"|"+nm]=hm;
        });
        turnos[n]=list;
      });
      if(bad)return toast(bad);
      negs.forEach(function(n){if(!turnos[n])turnos[n]=[]});
      S.cat.typing=false;
      saveCfg({negocios:negs,turnos:turnos,limites:lim},"Turnos guardados");
    },
    /* equipo */
    "eq-edit":function(){var u=S.eq.users.filter(function(x){return x.email===id})[0];if(u){S.eq.form={email:u.email,nombre:u.nombre,telefono:u.telefono||"",turnos:(u.turnos||[]).slice(),rol:u.rol,estado:u.estado==="pendiente"?"aprobado":u.estado,negocios:(u.negocios||[]).slice()};S.eq.editing=true;render();window.scrollTo(0,0)}},
    "eq-set":function(){S.eq.form[el.dataset.k]=v;render()},
    "eq-neg":function(){var n=S.cfg.todosNegocios[+v],a=S.eq.form.negocios,i=a.indexOf(n);if(i>-1)a.splice(i,1);else a.push(n);el.classList.toggle("on")},
    "eq-tur":function(){var a=S.eq.form.turnos=S.eq.form.turnos||[],i=a.indexOf(v);if(i>-1)a.splice(i,1);else a.push(v);el.classList.toggle("on")},
    "eq-cancel":function(){S.eq.form=null;S.eq.editing=false;render()},
    "eq-save":function(){
      var f=S.eq.form;
      if((f.rol==="lider"||f.rol==="colaborador")&&f.estado==="aprobado"&&!f.negocios.length)return toast("Asigna al menos un negocio.");
      guarded(async function(){
        await api("setUser",{email:f.email,telefono:f.telefono||"",turnos:(f.turnos||[]),rol:f.rol,estado:f.estado,negocios:(f.rol==="lider"||f.rol==="colaborador")?f.negocios:[]});
        S.contactos=null;S.eq.form=null;S.eq.editing=false;toast("Guardado");S.eq.users=await api("listUsers");render();
      });
    }
  };
  if(A[act])A[act]();
});
document.addEventListener("visibilitychange",function(){if(!document.hidden&&S.auth==="app"&&Date.now()-S.lastSync>45000)refresh(false)});

/* ---------- arranque ---------- */
boot();
})();

document.addEventListener("click",function(ev){var t=ev.target;if(t&&t.classList&&t.classList.contains("dpin")&&t.showPicker){try{t.showPicker()}catch(e){}}});
</script>
</body>
</html>
